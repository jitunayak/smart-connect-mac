[package]
name = "smartconnect-fex"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Client for the phone's \"fex\" file-transfer server (HTTPS + WebSocket, fingerprint-pinned): pulls the app icons Smart Connect offers on service 17, reusable for clipboard images"

[lib]
name = "smartconnect_fex"
path = "src/lib.rs"

[[bin]]
name = "smartconnect-fex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
libc = "0.2"
# Deflate entries in the transfer zip (the icon archive itself is observed as Store-only).
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
